<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة جنان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#F8EEDC;--card:#FFFDF7;--ink:#143511;--muted:#5E6450;--brand:#22603A;--brand2:#1A4D2E;--on:#F8EEDC;--leaf:#5B7215;--gold:#DE9B13;--goldink:#8A5A0A;--clay:#EAD9B5;--line:#E3D6BC;--danger:#A8322A;--shadow:0 1px 2px rgba(15,61,34,.05),0 6px 18px rgba(15,61,34,.07)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 "Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;letter-spacing:0;word-spacing:.03em;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Kufi Arabic","Noto Sans Arabic",sans-serif;font-weight:700;line-height:1.45;margin:0 0 10px;letter-spacing:0}
h1{font-size:clamp(25px,5vw,32px);font-weight:800}h2{font-size:20px}h3{font-size:17px}
button,input,select,textarea{font:inherit}
.topbar{background:var(--brand);color:var(--on);border-bottom:4px solid var(--gold)}
.topbar header{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.topbar .who{margin-inline-start:auto;font-size:14px;opacity:.85}
.topbar .btn.ghost{color:var(--on);border-color:rgba(255,255,255,.45)}.topbar .btn.ghost:hover{background:rgba(255,255,255,.12)}
.app{max-width:1100px;margin:0 auto;padding:4px 16px 104px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-family:"Noto Kufi Arabic";font-weight:700;font-size:26px;white-space:nowrap;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--muted)}
.meter{height:10px;background:var(--clay);border-radius:999px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--brand))}
.btn{font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700;background:#F3E6CC}td.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:#FBF4E6}
tr.total td{background:var(--clay);font-weight:700}.neg{color:var(--danger)}
.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:14.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(222,155,19,.22)}
.inline{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{background:var(--brand);color:var(--on);border:1px solid var(--brand);border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600;transition:background .15s}
.btn:hover{background:var(--brand2)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--clay)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1A0A}.btn.gold:hover{background:#C88A0E}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;overflow-x:auto;box-shadow:0 -4px 14px rgba(20,53,17,.06);padding-bottom:env(safe-area-inset-bottom)}
nav.bar a{flex:1;min-width:84px;max-width:170px;text-align:center;padding:14px 4px;color:var(--muted);text-decoration:none;font:600 14px/1.4 "Noto Kufi Arabic",sans-serif}
nav.bar a.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--gold)}
.msg{position:fixed;inset-inline:16px;top:12px;margin:auto;max-width:520px;padding:12px 16px;border-radius:12px;background:var(--brand);color:var(--on);z-index:9;display:none;box-shadow:var(--shadow)}
.msg.err{background:var(--danger)}
.notice{background:var(--clay);border-radius:10px;padding:12px 14px;font-size:14px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--clay);font-weight:500}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.photos img{width:110px;height:80px;object-fit:cover;border-radius:10px}
.empty{color:var(--muted);text-align:center;padding:20px}
.login{max-width:420px;margin:6vh auto 0}
.preview{background:var(--gold);color:#1B1A0A;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:600}
.doc{font-size:15.5px;line-height:2}.doc h2{text-align:center;margin-bottom:4px;font-size:24px;color:var(--brand2)}.doc h3{color:var(--brand2);border-bottom:2px solid var(--clay);padding-bottom:4px}.doc .pn{font-family:"Noto Kufi Arabic";font-weight:700;font-size:17px}.doc .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.doc table td{padding:7px 6px}.doc ol{padding-inline-start:22px}
@media print{body *{visibility:hidden}#dlg,#dlg *{visibility:visible}#dlg{position:absolute;inset:0;max-width:none;border:0;box-shadow:none}.noprint{display:none!important}}
.hide{display:none!important}
.topbar .logo{height:58px;width:auto;display:block}@media(max-width:640px){.topbar .logo{height:46px}}
.brandsub{font:700 15px/1.3 "Noto Kufi Arabic",sans-serif;color:#fff;opacity:.95;border-inline-start:1px solid rgba(255,255,255,.4);padding-inline-start:12px}
@media(max-width:640px){.brandsub{font-size:12px;padding-inline-start:8px}}@media(max-width:359px){.brandsub{display:none}}
.pname{font-family:"Noto Kufi Arabic","Noto Sans Arabic",sans-serif;font-weight:700;font-size:18px;color:var(--ink);line-height:1.5}
.olist{display:grid;gap:0}.orow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 4px;border-bottom:1px solid var(--line)}.orow:last-child{border-bottom:0}
.av{width:46px;height:46px;border-radius:50%;background:var(--clay);color:var(--brand2);display:grid;place-items:center;font:800 19px "Noto Kufi Arabic";flex:none}
.oinfo{flex:1 1 220px}.ometa{font-size:14px;color:var(--muted)}.obal{font:700 17px "Noto Kufi Arabic";font-variant-numeric:tabular-nums;white-space:nowrap}
.oact{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:600px){.oact{width:100%}.oact .btn{flex:1}}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;max-width:min(520px,92vw);width:100%;background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(20,53,17,.45)}
</style>
</head>

$('#logout').onclick=async()=>{await sb.auth.signOut();me=null;loginView()};

async function start(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return loginView();
  me=await q(sb.from('profiles').select('*').eq('id',user.id).single());
  me.staff=['staff','admin'].includes(me.role);
  $('#who').textContent=me.full_name+(me.staff?' · فريق جنان':'');$('#logout').classList.remove('hide');
  buildNav();
  go((location.hash||'#home').slice(1));
}
function buildNav(){
  const staffMode=me.staff&&!asOwner;
  const tabs=staffMode?[['home','الملاك'],['lands','الأراضي'],['ops','العمليات'],['money','الحسابات'],['contracts','العقود']]:[['home','الرئيسية'],['account','الحساب'],['contract','العقد']];
  $('#nav').innerHTML=tabs.map(([v,t])=>`<a href="#${v}" data-v="${v}">${t}</a>`).join('');$('#nav').classList.remove('hide');
  $('#pv').innerHTML=asOwner?`<div class="preview">انت شايف البوابة زي ما ${esc(asOwner.full_name)} شايفها بالظبط <button class="btn sm" id="pvExit">رجوع للوحة جنان</button></div>`:'';
  if(asOwner)$('#pvExit').onclick=()=>{asOwner=null;buildNav();location.hash='home';go('home')};
}
window.addEventListener('hashchange',()=>me&&go(location.hash.slice(1)));
function go(v){view=v||'home';document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view.split('-')[0]));
  const r=me.staff&&!asOwner?{home:aOwners,lands:aLands,ops:aOps,money:aMoney,contracts:aContracts}:{home:oHome,account:oAccount,contract:oContract};
  const base=view.split('-')[0];(r[base]||r.home)(view.split('-').slice(1).join('-'));window.scrollTo(0,0)}

function ledgerTable(rows){let bal=0;
  return rows.length?`<table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>الرصيد</th></tr></thead><tbody>${rows.map(r=>{bal+=Number(r.amount);return `<tr><td>${day(r.entry_date)}</td><td>${esc(r.description)}<br><span class="tag">${KIND[r.kind]}</span>${r.lands?` <span style="font-size:13px;color:var(--muted)">${esc(r.lands.name)}</span>`:''}</td><td class="n ${r.amount<0?'neg':''}">${fmt(r.amount)}</td><td class="n">${fmt(bal)}</td></tr>`}).join('')}<tr class="total"><td></td><td>الرصيد</td><td></td><td class="n">${fmt(bal)}</td></tr></tbody></table>`:'<p class="empty">لسه مفيش حركات.</p>'}

async function splitLedger(land,base){ // يقسم القيد على الملاك حسب النصيب
  const os=land.land_owners||[];if(!os.length){toast('الأرض دي مالهاش ملاك مربوطين. اربطها من تاب الأراضي.',true);throw 0}
  await q(sb.from('ledger_entries').insert(os.map(o=>({...base,owner_id:o.owner_id,land_id:land.id,amount:Math.round(base.amount*o.share_num/o.share_den*100)/100}))));
}

async function uploadPhotos(landId,opId,files){
  for(const file of files.filter(x=>x&&x.size)){const path=`${landId}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;
    const {error}=await sb.storage.from('land-media').upload(path,file);if(error){toast(error.message,true);continue}
    await q(sb.from('operation_media').insert({operation_id:opId,storage_path:path,taken_at:new Date().toISOString()}))}
}

  <form class="card" id="mForm"><h2>قيد جديد</h2><div class="field"><label>النوع</label><select name="kind" id="mKind">${Object.entries(KIND).filter(([k])=>k!=='invoice').map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div>

  $('#pick').onchange=e=>location.hash='money-'+e.target.value;

      await splitLedger(land,{entry_date:f.entry_date,kind:'sale',description:f.description,amount:amt});

    if(ph)window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank');else copyText(msg)});
  document.querySelectorAll('.edC').forEach(x=>x.onclick=()=>{const c=cs.find(o=>o.id===x.dataset.id);
    editor('تعديل العقد (مسودة)',[{name:'package',label:'الباقة',value:c.package,options:[['full_management','الإدارة الكاملة'],['monitoring','المتابعة والرقابة']]},{name:'mgmt_fee_per_feddan',label:'رسوم الإدارة / فدان / سنة',type:'number',value:c.mgmt_fee_per_feddan,required:true},{name:'success_fee_pct',label:'نسبة البيع %',type:'number',step:'0.5',value:c.success_fee_pct,required:true}],
      async f=>{await q(sb.from('contracts').update({package:f.package,mgmt_fee_per_feddan:+f.mgmt_fee_per_feddan,success_fee_pct:+f.success_fee_pct}).eq('id',c.id).eq('status','draft'));toast('اتعدّل العقد.')},
      {label:'مسح العقد',confirm:'مسح المسودة دي نهائيًا؟',run:async()=>{await q(sb.from('contracts').delete().eq('id',c.id).eq('status','draft'));toast('اتمسح العقد.')}})});
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')loginView()});
start().catch(()=>loginView());
}
</script>
