.app{max-width:1080px;width:calc(100% - 24px);margin:16px auto 112px;padding:6px 20px 26px;background:rgba(255,252,244,.94);border:1px solid rgba(222,155,19,.6);border-radius:26px;box-shadow:0 0 0 6px rgba(255,252,244,.4),0 22px 60px rgba(20,53,17,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media(max-width:600px){.app{padding:4px 14px 20px;border-radius:22px;margin-top:12px}.card{padding:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-family:"Cairo";font-weight:700;font-size:26px;white-space:nowrap;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--muted)}
.meter{height:10px;background:var(--clay);border-radius:999px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--brand))}
.btn{font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700;background:#F3E6CC}td.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:#FBF4E6}
tr.total td{background:var(--clay);font-weight:700}.neg{color:var(--danger)}
.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:14.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(222,155,19,.22)}
.inline{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{background:var(--brand);color:var(--on);border:1px solid var(--brand);border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600;transition:background .15s}
.btn:hover{background:var(--brand2)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--clay)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1A0A}.btn.gold:hover{background:#C88A0E}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav.bar{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;background:rgba(255,252,244,.97);border:1px solid rgba(222,155,19,.55);border-radius:22px;display:flex;justify-content:center;overflow-x:auto;box-shadow:0 10px 30px rgba(20,53,17,.25)}
nav.bar a{flex:1;min-width:84px;max-width:170px;text-align:center;padding:14px 4px;color:var(--muted);text-decoration:none;font:600 13px/1.3 "Cairo",sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px}nav.bar a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bar a.on{color:var(--brand);box-shadow:inset 0 -3px 0 var(--gold)}
.msg{position:fixed;inset-inline:16px;top:12px;margin:auto;max-width:520px;padding:12px 16px;border-radius:12px;background:var(--brand);color:var(--on);z-index:9;display:none;box-shadow:var(--shadow)}
.msg.err{background:var(--danger)}
.notice{background:var(--clay);border-radius:10px;padding:12px 14px;font-size:14px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--clay);font-weight:500}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.photos img{width:110px;height:80px;object-fit:cover;border-radius:10px}
.empty{color:var(--muted);text-align:center;padding:20px}
.login{max-width:420px;margin:6vh auto 0}
.preview{background:var(--gold);color:#1B1A0A;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:600}
.doc{font-size:15.5px;line-height:2}.doc h2{text-align:center;margin-bottom:4px;font-size:24px;color:var(--brand2)}.doc h3{color:var(--brand2);border-bottom:2px solid var(--clay);padding-bottom:4px}.doc .pn{font-family:"Lalezar";font-weight:400;font-size:20px}.doc .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.doc table td{padding:7px 6px}.doc ol{padding-inline-start:22px}
@media print{body *{visibility:hidden}#dlg,#dlg *{visibility:visible}#dlg{position:absolute;inset:0;max-width:none;border:0;box-shadow:none}.noprint{display:none!important}}
.hide{display:none!important}
.hero{position:relative;overflow:hidden;margin-top:16px;border-radius:22px;padding:20px;color:#FBF3E3;background:radial-gradient(120% 90% at 0% 0%,rgba(222,155,19,.28),transparent 55%),linear-gradient(160deg,#25521F 0%,#17401A 45%,#0F2E10 100%);box-shadow:0 14px 34px rgba(20,53,17,.3)}
.hero::after{content:"";position:absolute;inset-inline-start:-30px;bottom:-40px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.05)}
.hero .hi{display:flex;gap:12px;align-items:center}.hero .av{background:rgba(255,255,255,.12);color:#FBF3E3;border-color:var(--gold)}
.hero h1{color:#FBF3E3;margin:0;font-size:clamp(25px,6vw,32px)}.hero .sub{font-size:14px;opacity:.85}
.hero .bal{margin:18px 0 4px;color:#E6B957;font:700 clamp(34px,9vw,44px)/1.1 "Cairo",sans-serif;color:#F4C55A;font-variant-numeric:tabular-nums}.hero .bl{font-size:14px;opacity:.85}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.hero .mini div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 6px;text-align:center}.hero .mini b{display:block;font:700 20px "Cairo"}.hero .mini span{font-size:12px;opacity:.85}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa button,.qa a{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:var(--shadow);font:600 13.5px/1.4 "Cairo",sans-serif;color:var(--ink)}
.qa svg{display:block;margin:0 auto 6px;width:28px;height:28px;padding:9px;border-radius:12px;background:var(--clay);fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;box-sizing:content-box}
.qa button:disabled{opacity:.45;cursor:not-allowed}
.lcard{display:block;color:inherit;text-decoration:none;padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:10px;background:#FFFEFA;transition:border-color .15s}.lcard:hover{border-color:var(--gold)}
.lcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.lcard .chip{font-size:12.5px;background:#E7F0DA;color:var(--brand);border-radius:999px;padding:2px 10px;font-weight:600}
.trust{display:grid;gap:8px;margin-top:14px}.trust div{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}.trust svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.authcard{border-top:4px solid var(--gold)}
.lhead{text-align:center;margin-top:10px}.lhead img{width:112px;height:112px;display:block;margin:0 auto 6px;filter:drop-shadow(0 8px 18px rgba(20,53,17,.25))}.lhead h1{margin:0}.lhead h1{font-size:0;line-height:0;margin:0}.bcard{background:#123310;border-radius:22px;padding:18px 16px 20px;border:1px solid rgba(224,174,69,.5);box-shadow:0 14px 34px rgba(10,30,8,.35)}.lhead .blogo{width:min(100%,340px);height:auto;margin:0 auto;filter:none;-webkit-mask-image:radial-gradient(ellipse 70% 75% at 50% 50%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 70% 75% at 50% 50%,#000 72%,transparent 100%)}.bsub{color:#E6B957;font:400 clamp(18px,5vw,22px)/1.4 "Lalezar","Cairo",sans-serif;margin-top:6px}.bline{width:120px;height:2px;margin:10px auto;background:linear-gradient(90deg,transparent,#E0AE45,transparent)}.bslogan{color:#F3E3BC;font:700 clamp(16px,4.4vw,19px)/1.6 "Cairo",sans-serif}.lhead .wmk{width:auto;height:clamp(70px,20vw,92px);filter:none;margin:0 auto}.lhead p{margin:6px 0 0;color:var(--brand2);font-size:clamp(19px,5vw,23px);font-weight:700;line-height:1.6}
@media(max-width:600px){.topbar .who{display:none}.topbar header{flex-wrap:nowrap;padding:8px 12px}.topbar #logout{margin-inline-start:auto}}
.topbar .logo{height:58px;width:auto;display:block;-webkit-mask-image:radial-gradient(ellipse 72% 80% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 72% 80% at 50% 50%,#000 70%,transparent 100%)}@media(max-width:640px){.topbar .logo{height:46px}}
.brandsub{font:400 17px/1.3 "Lalezar","Cairo",sans-serif;color:#E6B957;border-inline-start:1px solid rgba(224,174,69,.45);padding-inline-start:12px}
@media(max-width:640px){.brandsub{font-size:12px;padding-inline-start:8px;white-space:nowrap}.topbar .logo{height:42px!important}}@media(max-width:359px){.brandsub{display:none}}
.pname{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:21px;color:var(--ink);line-height:1.5}
.olist{display:grid;gap:0}.orow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 4px;border-bottom:1px solid var(--line)}.orow:last-child{border-bottom:0}

.oinfo{flex:1 1 220px}.ometa{font-size:14px;color:var(--muted)}.obal{font:700 17px "Cairo";font-variant-numeric:tabular-nums;white-space:nowrap}
.oact{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:600px){.oact{width:100%}.oact .btn{flex:1}}

  <form class="card authcard" id="authForm"><h2 style="text-align:center">${mode==='up'?'حساب مالك جديد':'تسجيل الدخول'}</h2>
    ${mode==='up'?`<div class="field"><label>الاسم بالكامل</label><input name="full_name" required></div>
    <div class="inline"><div class="field"><label>رقم الموبايل</label><input name="phone" inputmode="tel"></div><div class="field"><label>بلد الإقامة</label><input name="country" placeholder="السعودية"></div></div>`:''}
    <div class="field"><label>الإيميل</label><input name="email" type="email" required autocomplete="username"></div>
    <div class="field"><label>كلمة السر</label><input name="password" type="password" required minlength="6" autocomplete="${mode==='up'?'new-password':'current-password'}"></div>
    <button class="btn" style="width:100%">${mode==='up'?'إنشاء حساب':'دخول'}</button>
    <p style="text-align:center;margin:12px 0 0"><button type="button" class="btn ghost sm" id="switch">${mode==='up'?'عندي حساب، دخول':'مالك جديد؟ اعمل حساب'}</button></p>
  </form>
  <div class="trust"><div><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>بياناتك محمية، وكل مالك يشوف حسابه بس.</div><div><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M10 13h6M10 17h6"/></svg>كل عملية على أرضك بفاتورة وصور.</div><div><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20V10l6-5 6 5v10"/></svg>العقد الرسمي ورقي، والتوكيل من الشهر العقاري أو القنصلية.</div></div></div>`;
  $('#switch').onclick=()=>loginView(mode==='up'?'in':'up');
  $('#authForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    if(mode==='up'){const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{full_name:f.full_name}}});
      if(error)return toast(error.message,true);
      if(!data.session)return toast('اتعمل الحساب. افتح الإيميل وأكّد التسجيل، وبعدين ادخل.');
      await sb.from('profiles').update({phone:f.phone||null,country:f.country||null}).eq('id',data.user.id);
    }else{const {error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});if(error)return toast('الإيميل أو كلمة السر غلط',true)}
    start()};
}
$('#logout').onclick=async()=>{await sb.auth.signOut();me=null;loginView()};

async function start(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return loginView();
  me=await q(sb.from('profiles').select('*').eq('id',user.id).single());
  me.staff=['staff','admin'].includes(me.role);
  $('#who').textContent=me.full_name+(me.staff?' · فريق جنان':'');$('#logout').classList.remove('hide');
  buildNav();
  go((location.hash||'#home').slice(1));
}

async function splitLedger(land,base){ // يقسم القيد على الملاك حسب النصيب
  const os=land.land_owners||[];if(!os.length){toast('الأرض دي مالهاش ملاك مربوطين. اربطها من تاب الأراضي.',true);throw 0}
  await q(sb.from('ledger_entries').insert(os.map(o=>({...base,owner_id:o.owner_id,land_id:land.id,amount:Math.round(base.amount*o.share_num/o.share_den*100)/100}))));
}

async function uploadPhotos(landId,opId,files){
  for(const file of files.filter(x=>x&&x.size)){const path=`${landId}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;
    const {error}=await sb.storage.from('land-media').upload(path,file);if(error){toast(error.message,true);continue}
    await q(sb.from('operation_media').insert({operation_id:opId,storage_path:path,taken_at:new Date().toISOString()}))}
}

async function aMoney(ownerId){

  <div class="field"><label>البيان</label><input name="description" required placeholder="تحويل مقدم موسم القمح"></div>
  <div class="field hide" id="pctF"><label>نسبة جنان من البيع %</label><input name="pct" type="number" min="0" max="100" step="0.5" value="5"></div>
  <p class="notice" id="mHint">البيع بيتقسم على الملاك حسب نصيبهم، ونسبة جنان بتتخصم تلقائي.</p><button class="btn">تسجيل</button></form>
  <div class="card"><h2>كشف حساب</h2><div class="field"><select id="pick">${opts(own,'id','full_name',sel)}</select></div>
  ${rows.length?`<table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${day(r.entry_date)}</td><td>${esc(r.description)}<br><span class="tag">${KIND[r.kind]}</span></td><td class="n ${r.amount<0?'neg':''}">${fmt(r.amount)}</td><td>${r.reverses_id||reversed.has(r.id)?'<span style="font-size:12px;color:var(--muted)">مصحَّح</span>':`<button class="btn sm ghost rev" data-id="${r.id}">إلغاء بقيد عكسي</button>`}</td></tr>`).join('')}<tr class="total"><td></td><td>الرصيد</td><td class="n">${fmt(rows.reduce((a,r)=>a+Number(r.amount),0))}</td><td></td></tr></tbody></table>`:'<p class="empty">لسه مفيش حركات.</p>'}</div></div>`;
  $('#pick').onchange=e=>location.hash='money-'+e.target.value;
  const kindUI=()=>{const k=$('#mKind').value;$('#pctF').classList.toggle('hide',k!=='sale');$('#mHint').classList.toggle('hide',k!=='sale');$('#mOwnerF').classList.toggle('hide',k==='sale')};$('#mKind').onchange=kindUI;kindUI();
  $('#mForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const amt=+f.amount;

    toast('اتسجل القيد.');aMoney(f.owner_id||sel)}catch(err){}};
  document.querySelectorAll('.rev').forEach(x=>x.onclick=async()=>{const r=rows.find(y=>String(y.id)===x.dataset.id);
    if(!await confirmBox(`إلغاء القيد "${r.description}" (${fmt(r.amount)})؟ هيتسجل قيد عكسي بنفس المبلغ، والقيد الأصلي هيفضل ظاهر للمالك.`))return;
    await q(sb.from('ledger_entries').insert({owner_id:r.owner_id,land_id:r.land_id,season_id:r.season_id,entry_date:today(),kind:'adjustment',description:'إلغاء: '+r.description,amount:-r.amount,reverses_id:r.id}));toast('اتسجل القيد العكسي.');aMoney(sel)});
}

async function aContracts(){
  const [cs,ps,lands,tv]=await Promise.all([q(sb.from('contracts').select(C_Q).order('created_at',{ascending:false})),owners(),q(sb.from('lands').select('id,name').order('name')),q(sb.from('terms_versions').select('id,version').order('id',{ascending:false}))]);
  const own=ps.filter(p=>p.role==='owner');
  main.innerHTML=`<h1 style="margin-top:16px">العقود</h1>${tv.length?'':'<p class="notice">لسه مفيش نسخة بنود. شغّل كود البنود في SQL Editor الأول.</p>'}<div class="grid two">
  <form class="card" id="cForm"><h2>عقد جديد</h2>${own.length?'':'<p class="notice">مفيش ملاك مسجلين. المالك لازم يعمل حساب من صفحة الدخول الأول، والعقد بيتعمل باسمه.</p>'}<div class="field"><label>الأرض</label><select name="land_id" required>${opts(lands,'id','name')}</select></div><div class="field"><label>المالك</label><select name="owner_id" required>${opts(own,'id','full_name')}</select></div>
  <div class="field"><label>الباقة</label><select name="package"><option value="full_management">الإدارة الكاملة</option><option value="monitoring">المتابعة والرقابة</option></select></div>
  <div class="inline"><div class="field"><label>رسوم الإدارة / فدان / سنة</label><input name="mgmt_fee_per_feddan" type="number" value="2000" required></div><div class="field"><label>نسبة البيع %</label><input name="success_fee_pct" type="number" step="0.5" value="5" required></div></div>
  <div class="field"><label>نسخة البنود</label><select name="terms_version_id" required>${opts(tv,'id','version')}</select></div><button class="btn" ${tv.length&&own.length?'':'disabled'}>حفظ العقد للمالك</button>
  <p class="notice" style="margin-top:10px">العقد بيظهر للمالك في تاب "العقد" لما يدخل البوابة. بعد الحفظ اضغط "رسالة واتساب" وابعتهاله.</p></form>
  <div class="card"><h2>كل العقود</h2>${cs.map(c=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><span class="pname">${esc(c.profiles?.full_name)}</span> <span class="tag">${STATUS[c.status]}</span><div style="font-weight:600">${esc(c.lands?.name)}</div>
  <div class="row"><span>${c.package==='full_management'?'إدارة كاملة':'متابعة'} · ${fmt(c.mgmt_fee_per_feddan)}/فدان · ${c.success_fee_pct}%${c.accepted_online_at?' · وافق '+day(c.accepted_online_at):''}</span></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn sm gold vc" data-id="${c.id}">عرض العقد</button>${c.status==='draft'?`<button class="btn sm wa" data-id="${c.id}">رسالة واتساب</button><button class="btn sm ghost edC" data-id="${c.id}">تعديل</button>`:''}${c.status==='accepted_online'?`<button class="btn sm st" data-id="${c.id}" data-s="signed">اتوقّع ورقيًا</button>`:c.status==='signed'?`<button class="btn sm st" data-id="${c.id}" data-s="active">تفعيل</button>`:c.status==='active'?`<button class="btn sm ghost st" data-id="${c.id}" data-s="terminated">إنهاء العقد</button>`:''}</div></div>`).join('')||'<p class="empty">مفيش عقود.</p>'}</div></div>`;
  $('#cForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await q(sb.from('contracts').insert({...f,terms_version_id:+f.terms_version_id,mgmt_fee_per_feddan:+f.mgmt_fee_per_feddan,success_fee_pct:+f.success_fee_pct}));toast('اتحفظ العقد. ابعت للمالك رسالة الواتساب.');aContracts()};
  document.querySelectorAll('.vc').forEach(b=>b.onclick=()=>showContract(cs.find(x=>x.id===b.dataset.id)));
  document.querySelectorAll('.st').forEach(b=>b.onclick=async()=>{if(b.dataset.s==='terminated'&&!await confirmBox('إنهاء العقد ده؟'))return;const u={status:b.dataset.s};if(b.dataset.s==='signed')u.signed_at=today();if(b.dataset.s==='active')u.start_date=today();if(b.dataset.s==='terminated')u.end_date=today();await q(sb.from('contracts').update(u).eq('id',b.dataset.id));aContracts()});
  document.querySelectorAll('.wa').forEach(b=>b.onclick=()=>{const c=cs.find(x=>x.id===b.dataset.id);
    const msg=`أهلًا يا ${c.profiles?.full_name||''}،\nعقد إدارة ${c.lands?.name||'أرضك'} مع جنان للاستثمار الزراعي جاهز.\nادخل البوابة بحسابك، وراجع البنود والأسعار في تاب "العقد"، ووافق عليها:\n${PORTAL}\n\nجنان .. أرضك تحت نظرك ومحصولك كله ليك`;
    const ph=(c.profiles?.phone||'').replace(/\D/g,'');
    if(ph)window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank');else copyText(msg)});
  document.querySelectorAll('.edC').forEach(x=>x.onclick=()=>{const c=cs.find(o=>o.id===x.dataset.id);
    editor('تعديل العقد (مسودة)',[{name:'package',label:'الباقة',value:c.package,options:[['full_management','الإدارة الكاملة'],['monitoring','المتابعة والرقابة']]},{name:'mgmt_fee_per_feddan',label:'رسوم الإدارة / فدان / سنة',type:'number',value:c.mgmt_fee_per_feddan,required:true},{name:'success_fee_pct',label:'نسبة البيع %',type:'number',step:'0.5',value:c.success_fee_pct,required:true}],
      async f=>{await q(sb.from('contracts').update({package:f.package,mgmt_fee_per_feddan:+f.mgmt_fee_per_feddan,success_fee_pct:+f.success_fee_pct}).eq('id',c.id).eq('status','draft'));toast('اتعدّل العقد.')},
      {label:'مسح العقد',confirm:'مسح المسودة دي نهائيًا؟',run:async()=>{await q(sb.from('contracts').delete().eq('id',c.id).eq('status','draft'));toast('اتمسح العقد.')}})});
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')loginView()});
start().catch(()=>loginView());
}
</script>
</body>
</html>
