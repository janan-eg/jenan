<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة جنان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8EEDC;--card:#FFFDF7;--ink:#143511;--muted:#5E6450;--brand:#143511;--on:#F8EEDC;--leaf:#5B7215;--gold:#DE9B13;--goldink:#8A5A0A;--clay:#EAD9B5;--line:#E3D6BC;--danger:#A8322A}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Cairo",Tahoma,sans-serif}
h1,h2,h3{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;line-height:1.2;margin:0 0 8px}
h1{font-size:clamp(26px,6vw,34px)}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit}
.app{max-width:1100px;margin:0 auto;padding:0 16px 96px}
header{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .brand{font-family:"Lalezar";font-size:30px;color:var(--brand)}header .brand i{color:var(--leaf);font-style:normal}
header .who{margin-inline-start:auto;font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:24px;white-space:nowrap}.stat span{font-size:13px;color:var(--muted)}
.meter{height:12px;background:var(--clay);border-radius:999px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:var(--brand)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}td.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.total td{background:var(--clay);font-weight:700}.neg{color:var(--danger)}
.field{display:grid;gap:4px;margin:10px 0}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;min-height:44px;font-size:16px}
.inline{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn[disabled]{opacity:.5}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;overflow-x:auto}
nav.bar a{flex:1;min-width:84px;max-width:170px;text-align:center;padding:12px 4px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
nav.bar a.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--gold)}
.msg{position:fixed;inset-inline:16px;top:12px;margin:auto;max-width:520px;padding:12px 16px;border-radius:10px;background:var(--brand);color:var(--on);z-index:9;display:none}
.msg.err{background:var(--danger)}
.notice{background:var(--clay);border-radius:10px;padding:12px 14px;font-size:14px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--clay)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.photos img{width:110px;height:80px;object-fit:cover;border-radius:8px}
.empty{color:var(--muted);text-align:center;padding:20px}
.login{max-width:420px;margin:8vh auto 0}
.hide{display:none!important}
</style>
</head>
<body>
<div class="msg" id="msg"></div>
<div class="app">
  <header>
    <div class="brand">جنا<i>ن</i></div>
    <div class="who" id="who"></div>
    <button class="btn ghost sm hide" id="logout">خروج</button>
  </header>
  <main id="main"><p class="empty">جاري التحميل…</p></main>
</div>
<nav class="bar hide" id="nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
{
const SUPABASE_URL='https://ajjfodjzixosezyrycal.supabase.co';
const SUPABASE_KEY='sb_publishable_RkFCNed4jg4ZXkCXPQZMOQ_1ZIpaKQ8';

const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ar-EG-u-nu-latn',{maximumFractionDigits:2})+' ج';
const day=s=>s?new Date(s).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short',year:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);
function toast(t,err){const m=$('#msg');m.textContent=t;m.className='msg'+(err?' err':'');m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',4000)}
const KIND={deposit:'تحويل من المالك',invoice:'فاتورة خدمة',management_fee:'رسوم إدارة',sale:'بيع محصول',success_fee:'نسبة جنان',transfer_out:'تحويل للمالك',adjustment:'تسوية'};
const SIGN={deposit:1,sale:1,adjustment:1,invoice:-1,management_fee:-1,success_fee:-1,transfer_out:-1};
const STATUS={draft:'مسودة',accepted_online:'موافقة أونلاين',signed:'متوقّع ورقيًا',active:'ساري',terminated:'منتهي'};

if(!window.supabase){main.innerHTML='<div class="card"><h2>مش قادر أوصل للإنترنت</h2><p>مكتبة Supabase ما اتحملتش. اتأكد إن النت شغال وافتح الصفحة تاني.</p></div>';throw 0}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, view='home', cache={};

async function q(p){const {data,error}=await p;if(error){toast(error.message,true);throw error}return data}

/* ---------- الدخول ---------- */
function loginView(mode='in'){
  $('#nav').classList.add('hide');$('#logout').classList.add('hide');$('#who').textContent='';
  main.innerHTML=`<div class="login"><h1>أرضك تحت نظرك</h1><p style="color:var(--muted)">جنان .. أرضك تحت نظرك ومحصولك كله ليك</p>
  <form class="card" id="authForm">
    ${mode==='up'?`<div class="field"><label>الاسم بالكامل</label><input name="full_name" required></div>
    <div class="inline"><div class="field"><label>رقم الموبايل</label><input name="phone" inputmode="tel"></div><div class="field"><label>بلد الإقامة</label><input name="country" placeholder="السعودية"></div></div>`:''}
    <div class="field"><label>الإيميل</label><input name="email" type="email" required autocomplete="username"></div>
    <div class="field"><label>كلمة السر</label><input name="password" type="password" required minlength="6" autocomplete="${mode==='up'?'new-password':'current-password'}"></div>
    <button class="btn" style="width:100%">${mode==='up'?'إنشاء حساب':'دخول'}</button>
    <p style="text-align:center;margin:12px 0 0"><button type="button" class="btn ghost sm" id="switch">${mode==='up'?'عندي حساب، دخول':'مالك جديد؟ اعمل حساب'}</button></p>
  </form></div>`;
  $('#switch').onclick=()=>loginView(mode==='up'?'in':'up');
  $('#authForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    if(mode==='up'){const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{full_name:f.full_name}}});
      if(error)return toast(error.message,true);
      if(!data.session)return toast('اتعمل الحساب. افتح الإيميل وأكّد التسجيل، وبعدين ادخل.');
      await sb.from('profiles').update({phone:f.phone||null,country:f.country||null}).eq('id',data.user.id);
    }else{const {error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});if(error)return toast('الإيميل أو كلمة السر غلط',true)}
    start()};
}
$('#logout').onclick=async()=>{await sb.auth.signOut();me=null;loginView()};

async function start(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return loginView();
  me=await q(sb.from('profiles').select('*').eq('id',user.id).single());
  me.staff=['staff','admin'].includes(me.role);
  $('#who').textContent=me.full_name+(me.staff?' · فريق جنان':'');$('#logout').classList.remove('hide');
  const tabs=me.staff?[['home','الملاك'],['lands','الأراضي'],['ops','العمليات'],['money','الحسابات'],['contracts','العقود']]:[['home','الرئيسية'],['account','الحساب'],['contract','العقد']];
  $('#nav').innerHTML=tabs.map(([v,t])=>`<a href="#${v}" data-v="${v}">${t}</a>`).join('');$('#nav').classList.remove('hide');
  go((location.hash||'#home').slice(1));
}
window.addEventListener('hashchange',()=>me&&go(location.hash.slice(1)));
function go(v){view=v||'home';document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view.split('-')[0]));
  const r=me.staff?{home:aOwners,lands:aLands,ops:aOps,money:aMoney,contracts:aContracts}:{home:oHome,account:oAccount,contract:oContract};
  const base=view.split('-')[0];(r[base]||r.home)(view.split('-').slice(1).join('-'));window.scrollTo(0,0)}

/* ---------- بيانات مشتركة ---------- */
const LAND_Q='id,name,village,area_feddan,water_source,hiyaza_no,land_owners(owner_id,share_num,share_den,is_representative,profiles(full_name)),seasons(id,crop,start_date,end_date,budget,status,operations(id,op_date,op_type,description,invoice_amount,operation_media(id,storage_path)))';
const spent=s=>(s.operations||[]).reduce((a,o)=>a+Number(o.invoice_amount),0);
const curSeason=l=>[...(l.seasons||[])].sort((a,b)=>b.start_date.localeCompare(a.start_date))[0];
async function signed(paths){if(!paths.length)return {};const {data}=await sb.storage.from('land-media').createSignedUrls(paths,3600);const m={};(data||[]).forEach(x=>m[x.path]=x.signedUrl);return m}

function ledgerTable(rows){let bal=0;
  return rows.length?`<table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>الرصيد</th></tr></thead><tbody>${rows.map(r=>{bal+=Number(r.amount);return `<tr><td>${day(r.entry_date)}</td><td>${esc(r.description)}<br><span class="tag">${KIND[r.kind]}</span>${r.lands?` <span style="font-size:13px;color:var(--muted)">${esc(r.lands.name)}</span>`:''}</td><td class="n ${r.amount<0?'neg':''}">${fmt(r.amount)}</td><td class="n">${fmt(bal)}</td></tr>`}).join('')}<tr class="total"><td></td><td>الرصيد</td><td></td><td class="n">${fmt(bal)}</td></tr></tbody></table>`:'<p class="empty">لسه مفيش حركات.</p>'}

/* ---------- المالك ---------- */
async function oHome(landId){
  const lands=await q(sb.from('lands').select(LAND_Q).order('name'));cache.lands=lands;
  if(landId){const l=lands.find(x=>x.id===landId);if(l)return oLand(l)}
  const bal=await q(sb.from('owner_balances').select('balance').eq('owner_id',me.id));
  const area=lands.reduce((a,l)=>a+Number(l.area_feddan),0);
  main.innerHTML=`<h1 style="margin-top:16px">أهلًا يا ${esc(me.full_name.split(' ')[0])}</h1>
  <div class="stats"><div class="stat"><b>${area} فدان</b><span>أراضيك تحت إدارة جنان</span></div><div class="stat"><b style="color:var(--goldink)">${fmt(bal[0]?.balance||0)}</b><span>رصيدك عند جنان</span></div></div>
  <div class="card"><h2>أراضيك</h2>${lands.length?lands.map(l=>{const s=curSeason(l);const sp=s?spent(s):0;return `<a href="#home-${l.id}" style="display:block;color:inherit;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line)"><h3>${esc(l.name)}</h3><div class="row"><span>${l.area_feddan} فدان · ${esc(l.village)}${s?' · '+esc(s.crop):''}</span>${s&&s.budget>0?`<span>${Math.round(sp/s.budget*100)}% من الميزانية</span>`:''}</div>${s&&s.budget>0?`<div class="meter"><i style="width:${Math.min(100,sp/s.budget*100)}%"></i></div>`:''}</a>`}).join(''):'<p class="empty">لسه مفيش أرض مسجلة باسمك. فريق جنان هيضيفها بعد مراجعة المستندات.</p>'}</div>`;
}
async function oLand(l){
  const ops=(l.seasons||[]).flatMap(s=>(s.operations||[]).map(o=>({...o,crop:s.crop}))).sort((a,b)=>b.op_date.localeCompare(a.op_date));
  const urls=await signed(ops.flatMap(o=>(o.operation_media||[]).map(m=>m.storage_path)));
  const s=curSeason(l),sp=s?spent(s):0;
  main.innerHTML=`<p><a href="#home" class="btn ghost sm" style="text-decoration:none">→ رجوع</a></p><h1>${esc(l.name)}</h1>
  <div class="row"><span>${l.area_feddan} فدان · ${esc(l.village)} · ${esc(l.water_source||'')}</span></div>
  <div class="grid two"><div class="card"><h2>دفتر الأرض</h2>${ops.length?ops.map(o=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row"><b style="color:var(--ink)">${esc(o.op_type)}</b><b class="n" style="color:var(--ink)">${fmt(o.invoice_amount)}</b></div><div class="row"><span>${day(o.op_date)} · ${esc(o.crop)}</span><span>${esc(o.description||'')}</span></div>${(o.operation_media||[]).length?`<div class="photos">${o.operation_media.map(m=>urls[m.storage_path]?`<a href="${urls[m.storage_path]}" target="_blank"><img src="${urls[m.storage_path]}" alt="صورة ${esc(o.op_type)}"></a>`:'').join('')}</div>`:''}</div>`).join(''):'<p class="empty">لسه مفيش عمليات.</p>'}</div>
  <div class="card"><h2>ميزانية الموسم</h2>${s?`<div class="row"><span>${esc(s.crop)} · من ${day(s.start_date)}</span></div><div class="row"><span>المصروف</span><b style="color:var(--ink)">${fmt(sp)}</b></div><div class="meter"><i style="width:${s.budget>0?Math.min(100,sp/s.budget*100):0}%"></i></div><div class="row"><span>الميزانية</span><span>${fmt(s.budget)}</span></div><div class="row"><span>المتبقي</span><b style="color:var(--goldink)">${fmt(s.budget-sp)}</b></div>`:'<p class="empty">مفيش موسم مفتوح.</p>'}
  <h3 style="margin-top:16px">الملاك</h3>${(l.land_owners||[]).map(o=>`<div class="row"><span>${esc(o.profiles?.full_name||'وارث')}</span><span>${o.share_num}/${o.share_den}${o.is_representative?' · الوكيل':''}</span></div>`).join('')}</div></div>`;
}
async function oAccount(){
  const rows=await q(sb.from('ledger_entries').select('*,lands(name)').order('entry_date').order('id'));
  main.innerHTML=`<h1 style="margin-top:16px">كشف الحساب</h1><div class="card">${ledgerTable(rows)}</div><p class="notice" style="margin-top:12px">أي تصحيح بيتسجل كقيد جديد، ومفيش قيد بيتمسح. كده كل حاجة حصلت ظاهرة ليك.</p>`;
}
async function oContract(){
  const [cs,docs]=await Promise.all([q(sb.from('contracts').select('*,lands(name),terms_versions(version,body,price_list)').order('created_at')),q(sb.from('documents').select('*').order('uploaded_at',{ascending:false}))]);
  main.innerHTML=`<h1 style="margin-top:16px">العقد والمستندات</h1>
  ${cs.length?cs.map(c=>`<div class="card"><h2>${esc(c.lands?.name)}</h2><div class="row"><span>${c.package==='full_management'?'الإدارة الكاملة':'المتابعة والرقابة'}</span><span class="tag">${STATUS[c.status]}</span></div>
  <table style="margin:10px 0"><tr><td>رسوم الإدارة</td><td class="n">${fmt(c.mgmt_fee_per_feddan)} / فدان / سنة</td></tr><tr><td>نسبة من إيراد البيع</td><td class="n">${c.success_fee_pct}%</td></tr></table>
  <details><summary>نص البنود (${esc(c.terms_versions?.version)})</summary><div style="white-space:pre-line;font-size:14px;margin-top:8px">${esc(c.terms_versions?.body)}</div></details>
  ${c.status==='draft'?`<label style="display:flex;gap:8px;margin:12px 0"><input type="checkbox" class="agree" data-id="${c.id}" style="width:22px;height:22px"> قريت البنود والأسعار وموافق عليها.</label><button class="btn accept" data-id="${c.id}" disabled>موافقة على البنود</button>`:`<p class="notice" style="margin-top:12px">${c.accepted_online_at?'وافقت أونلاين يوم '+day(c.accepted_online_at)+'. ':''}العقد الرسمي بيتوقع ورقيًا، والتوكيل بيتعمل في الشهر العقاري أو القنصلية.</p>`}</div>`).join(''):'<div class="card"><p class="empty">فريق جنان هيجهز عقدك بعد ما تبعت مستنداتك.</p></div>'}
  <div class="card"><h2>رفع مستند</h2><form id="docForm"><div class="inline"><div class="field"><label>نوع المستند</label><select name="kind"><option value="national_id">البطاقة</option><option value="passport">الجواز</option><option value="hiyaza">الحيازة أو الملكية</option><option value="tawkeel">التوكيل</option><option value="heirs_certificate">إعلام الوراثة</option><option value="other">أخرى</option></select></div><div class="field"><label>الملف</label><input type="file" name="file" required accept="image/*,application/pdf"></div></div><button class="btn">رفع</button></form>
  ${docs.length?`<table style="margin-top:12px">${docs.map(d=>`<tr><td>${esc(d.kind)}</td><td>${day(d.uploaded_at)}</td><td>${d.verified_at?'<span class="tag">اتراجع</span>':'قيد المراجعة'}</td></tr>`).join('')}</table>`:''}</div>`;
  document.querySelectorAll('.agree').forEach(c=>c.onchange=()=>document.querySelector(`.accept[data-id="${c.dataset.id}"]`).disabled=!c.checked);
  document.querySelectorAll('.accept').forEach(b=>b.onclick=async()=>{await q(sb.from('contracts').update({status:'accepted_online',accepted_user_agent:navigator.userAgent}).eq('id',b.dataset.id));toast('اتسجلت موافقتك. فريق جنان هيكلمك يحدد معاد التوقيع.');oContract()});
  $('#docForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get('file');const path=`${me.id}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;
    const {error}=await sb.storage.from('owner-docs').upload(path,file);if(error)return toast(error.message,true);
    await q(sb.from('documents').insert({owner_id:me.id,kind:f.get('kind'),storage_path:path}));toast('اترفع المستند.');oContract()};
}

/* ---------- لوحة جنان ---------- */
const opts=(arr,v,t,sel)=>arr.map(x=>`<option value="${x[v]}" ${x[v]===sel?'selected':''}>${esc(typeof t==='function'?t(x):x[t])}</option>`).join('');
async function owners(){return cache.owners=await q(sb.from('profiles').select('*').order('full_name'))}

async function aOwners(){
  const [ps,bals,docs]=await Promise.all([owners(),q(sb.from('owner_balances').select('*')),q(sb.from('documents').select('*,profiles!documents_owner_id_fkey(full_name)').is('verified_at',null))]);
  const b={};bals.forEach(x=>b[x.owner_id]=x.balance);
  main.innerHTML=`<h1 style="margin-top:16px">الملاك</h1><div class="card"><table><thead><tr><th>الاسم</th><th>الإقامة</th><th>الدور</th><th>الرصيد</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.full_name)}<br><span style="font-size:13px;color:var(--muted)">${esc(p.phone||'')}</span></td><td>${esc(p.country||'')}</td><td>${p.role}</td><td class="n">${fmt(b[p.id]||0)}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h2>مستندات محتاجة مراجعة</h2>${docs.length?`<table>${docs.map(d=>`<tr><td>${esc(d.profiles?.full_name)}</td><td>${esc(d.kind)}</td><td><button class="btn sm ghost view" data-p="${esc(d.storage_path)}">فتح</button> <button class="btn sm ok" data-id="${d.id}">تمت المراجعة</button></td></tr>`).join('')}</table>`:'<p class="empty">مفيش مستندات جديدة.</p>'}</div>`;
  document.querySelectorAll('.view').forEach(x=>x.onclick=async()=>{const {data}=await sb.storage.from('owner-docs').createSignedUrl(x.dataset.p,600);if(data)window.open(data.signedUrl,'_blank')});
  document.querySelectorAll('.ok').forEach(x=>x.onclick=async()=>{await q(sb.from('documents').update({verified_by:me.id,verified_at:new Date().toISOString()}).eq('id',x.dataset.id));aOwners()});
}

async function aLands(){
  const [lands,ps]=await Promise.all([q(sb.from('lands').select(LAND_Q).order('name')),owners()]);cache.lands=lands;
  main.innerHTML=`<h1 style="margin-top:16px">الأراضي</h1><div class="grid two">
  <form class="card" id="landForm"><h2>أرض جديدة</h2><div class="field"><label>اسم الأرض</label><input name="name" required placeholder="أرض توشكى شرق"></div>
  <div class="inline"><div class="field"><label>القرية</label><input name="village" required></div><div class="field"><label>المساحة (فدان)</label><input name="area_feddan" type="number" step="0.01" min="0.01" required></div></div>
  <div class="inline"><div class="field"><label>رقم الحيازة</label><input name="hiyaza_no"></div><div class="field"><label>مصدر المية</label><input name="water_source" placeholder="بئر، ترعة"></div></div><button class="btn">حفظ الأرض</button></form>
  <form class="card" id="ownForm"><h2>ربط مالك بأرض</h2><div class="field"><label>الأرض</label><select name="land_id" required>${opts(lands,'id','name')}</select></div><div class="field"><label>المالك</label><select name="owner_id" required>${opts(ps,'id','full_name')}</select></div>
  <div class="inline"><div class="field"><label>النصيب: البسط</label><input name="share_num" type="number" min="1" value="1"></div><div class="field"><label>المقام</label><input name="share_den" type="number" min="1" value="1"></div></div>
  <label style="display:flex;gap:8px;margin:8px 0"><input type="checkbox" name="rep"> الوكيل عن باقي الورثة</label><button class="btn">ربط</button></form></div>
  <div class="card"><h2>كل الأراضي</h2>${lands.map(l=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(l.name)}</b> <span class="tag">${l.area_feddan} فدان</span><div class="row"><span>${esc(l.village)} · ${esc(l.water_source||'')}</span><span>${(l.land_owners||[]).map(o=>esc(o.profiles?.full_name)+' '+o.share_num+'/'+o.share_den).join('، ')}</span></div></div>`).join('')||'<p class="empty">مفيش أراضي.</p>'}</div>`;
  $('#landForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await q(sb.from('lands').insert(f));toast('اتحفظت الأرض.');aLands()};
  $('#ownForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await q(sb.from('land_owners').upsert({land_id:f.land_id,owner_id:f.owner_id,share_num:+f.share_num,share_den:+f.share_den,is_representative:!!f.rep}));toast('اتربط المالك بالأرض.');aLands()};
}

async function splitLedger(land,base){ // يقسم القيد على الملاك حسب النصيب
  const os=land.land_owners||[];if(!os.length)throw toast('الأرض دي مالهاش ملاك مربوطين.',true);
  await q(sb.from('ledger_entries').insert(os.map(o=>({...base,owner_id:o.owner_id,land_id:land.id,amount:Math.round(base.amount*o.share_num/o.share_den*100)/100}))));
}

async function aOps(){
  const lands=await q(sb.from('lands').select(LAND_Q).order('name'));cache.lands=lands;
  const seasons=lands.flatMap(l=>(l.seasons||[]).map(s=>({...s,land:l,label:l.name+' — '+s.crop+' '+s.start_date})));
  main.innerHTML=`<h1 style="margin-top:16px">العمليات</h1><div class="grid two">
  <form class="card" id="opForm"><h2>تسجيل عملية</h2><div class="field"><label>الموسم</label><select name="season_id" required>${opts(seasons,'id','label')}</select></div>
  <div class="inline"><div class="field"><label>التاريخ</label><input name="op_date" type="date" value="${today()}" required></div><div class="field"><label>العملية</label><input name="op_type" list="types" required placeholder="ري"><datalist id="types"><option>ري</option><option>حرث وتسوية</option><option>تقاوي</option><option>تسميد</option><option>مقاومة حشائش</option><option>حصاد ودراس</option></datalist></div></div>
  <div class="field"><label>وصف للمالك</label><input name="description" placeholder="ريّة تانية، المية منتظمة"></div>
  <div class="inline"><div class="field"><label>قيمة الفاتورة للمالك</label><input name="invoice_amount" type="number" min="0" step="0.01" required></div><div class="field"><label>تكلفة العامل (سري)</label><input name="worker_cost" type="number" min="0" step="0.01" value="0"></div></div>
  <div class="field"><label>صور (اختياري)</label><input name="photos" type="file" accept="image/*" multiple></div>
  <button class="btn">تسجيل وقيد الفاتورة في حساب الملاك</button></form>
  <form class="card" id="seasonForm"><h2>موسم جديد</h2><div class="field"><label>الأرض</label><select name="land_id" required>${opts(lands,'id','name')}</select></div>
  <div class="inline"><div class="field"><label>المحصول</label><input name="crop" required placeholder="قمح"></div><div class="field"><label>بداية الموسم</label><input name="start_date" type="date" value="${today()}" required></div></div>
  <div class="field"><label>الميزانية المتفق عليها</label><input name="budget" type="number" min="0" step="0.01" value="0"></div><button class="btn">فتح الموسم</button></form></div>`;
  $('#seasonForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await q(sb.from('seasons').insert({...f,budget:+f.budget,status:'running'}));toast('اتفتح الموسم.');aOps()};
  $('#opForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;
    try{const fd=new FormData(e.target),f=Object.fromEntries(fd),s=seasons.find(x=>x.id===f.season_id);
      const op=await q(sb.from('operations').insert({season_id:f.season_id,op_date:f.op_date,op_type:f.op_type,description:f.description||null,invoice_amount:+f.invoice_amount}).select().single());
      if(+f.worker_cost>0)await q(sb.from('operation_costs').insert({operation_id:op.id,worker_cost:+f.worker_cost}));
      for(const file of fd.getAll('photos').filter(x=>x.size)){const path=`${s.land.id}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;
        const {error}=await sb.storage.from('land-media').upload(path,file);if(error){toast(error.message,true);continue}
        await q(sb.from('operation_media').insert({operation_id:op.id,storage_path:path,taken_at:new Date().toISOString()}))}
      if(+f.invoice_amount>0)await splitLedger(s.land,{season_id:s.id,entry_date:f.op_date,kind:'invoice',description:f.op_type+(f.description?' — '+f.description:''),amount:-f.invoice_amount,operation_id:op.id});
      toast('اتسجلت العملية وظهرت للمالك.');aOps()}finally{btn.disabled=false}};
}

async function aMoney(ownerId){
  const [ps,lands]=await Promise.all([owners(),q(sb.from('lands').select(LAND_Q).order('name'))]);cache.lands=lands;
  const sel=ownerId||ps[0]?.id;const rows=sel?await q(sb.from('ledger_entries').select('*,lands(name)').eq('owner_id',sel).order('entry_date').order('id')):[];
  main.innerHTML=`<h1 style="margin-top:16px">الحسابات</h1><div class="grid two">
  <form class="card" id="mForm"><h2>قيد جديد</h2><div class="field"><label>النوع</label><select name="kind" id="mKind">${Object.entries(KIND).filter(([k])=>k!=='invoice').map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div>
  <div class="field" id="mOwnerF"><label>المالك</label><select name="owner_id">${opts(ps,'id','full_name',sel)}</select></div>
  <div class="field"><label>الأرض</label><select name="land_id"><option value="">—</option>${opts(lands,'id','name')}</select></div>
  <div class="inline"><div class="field"><label>التاريخ</label><input name="entry_date" type="date" value="${today()}" required></div><div class="field"><label>المبلغ (موجب دايمًا)</label><input name="amount" type="number" min="0.01" step="0.01" required></div></div>
  <div class="field"><label>البيان</label><input name="description" required placeholder="تحويل مقدم موسم القمح"></div>
  <div class="field hide" id="pctF"><label>نسبة جنان من البيع %</label><input name="pct" type="number" min="0" max="100" step="0.5" value="5"></div>
  <p class="notice" id="mHint">البيع بيتقسم على الملاك حسب نصيبهم، ونسبة جنان بتتخصم تلقائي.</p><button class="btn">تسجيل</button></form>
  <div class="card"><h2>كشف حساب</h2><div class="field"><select id="pick">${opts(ps,'id','full_name',sel)}</select></div>${ledgerTable(rows)}</div></div>`;
  $('#pick').onchange=e=>location.hash='money-'+e.target.value;
  const kindUI=()=>{const k=$('#mKind').value;$('#pctF').classList.toggle('hide',k!=='sale');$('#mHint').classList.toggle('hide',k!=='sale');$('#mOwnerF').classList.toggle('hide',k==='sale')};$('#mKind').onchange=kindUI;kindUI();
  $('#mForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const amt=+f.amount;
    if(f.kind==='sale'){const land=lands.find(l=>l.id===f.land_id);if(!land)return toast('اختار الأرض اللي اتباع محصولها.',true);
      await splitLedger(land,{entry_date:f.entry_date,kind:'sale',description:f.description,amount:amt});
      if(+f.pct>0)await splitLedger(land,{entry_date:f.entry_date,kind:'success_fee',description:`نسبة جنان ${f.pct}% — ${f.description}`,amount:-(amt*f.pct/100)});
    }else await q(sb.from('ledger_entries').insert({owner_id:f.owner_id,land_id:f.land_id||null,entry_date:f.entry_date,kind:f.kind,description:f.description,amount:SIGN[f.kind]*amt}));
    toast('اتسجل القيد.');aMoney(f.owner_id||sel)};
}

async function aContracts(){
  const [cs,ps,lands,tv]=await Promise.all([q(sb.from('contracts').select('*,lands(name),profiles(full_name)').order('created_at',{ascending:false})),owners(),q(sb.from('lands').select('id,name').order('name')),q(sb.from('terms_versions').select('id,version').order('id',{ascending:false}))]);
  main.innerHTML=`<h1 style="margin-top:16px">العقود</h1>${tv.length?'':'<p class="notice">لسه مفيش نسخة بنود. شغّل كود البنود في SQL Editor الأول.</p>'}<div class="grid two">
  <form class="card" id="cForm"><h2>عقد جديد</h2><div class="field"><label>الأرض</label><select name="land_id" required>${opts(lands,'id','name')}</select></div><div class="field"><label>المالك</label><select name="owner_id" required>${opts(ps,'id','full_name')}</select></div>
  <div class="field"><label>الباقة</label><select name="package"><option value="full_management">الإدارة الكاملة</option><option value="monitoring">المتابعة والرقابة</option></select></div>
  <div class="inline"><div class="field"><label>رسوم الإدارة / فدان / سنة</label><input name="mgmt_fee_per_feddan" type="number" value="2000" required></div><div class="field"><label>نسبة البيع %</label><input name="success_fee_pct" type="number" step="0.5" value="5" required></div></div>
  <div class="field"><label>نسخة البنود</label><select name="terms_version_id" required>${opts(tv,'id','version')}</select></div><button class="btn" ${tv.length?'':'disabled'}>إرسال العقد للمالك</button></form>
  <div class="card"><h2>كل العقود</h2>${cs.map(c=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(c.profiles?.full_name)}</b> — ${esc(c.lands?.name)} <span class="tag">${STATUS[c.status]}</span>
  <div class="row"><span>${fmt(c.mgmt_fee_per_feddan)}/فدان · ${c.success_fee_pct}%</span>${c.status==='accepted_online'?`<button class="btn sm st" data-id="${c.id}" data-s="signed">اتوقّع ورقيًا</button>`:c.status==='signed'?`<button class="btn sm st" data-id="${c.id}" data-s="active">تفعيل</button>`:''}</div></div>`).join('')||'<p class="empty">مفيش عقود.</p>'}</div></div>`;
  $('#cForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await q(sb.from('contracts').insert({...f,terms_version_id:+f.terms_version_id,mgmt_fee_per_feddan:+f.mgmt_fee_per_feddan,success_fee_pct:+f.success_fee_pct}));toast('العقد اتبعت، وهيظهر للمالك يوافق عليه.');aContracts()};
  document.querySelectorAll('.st').forEach(b=>b.onclick=async()=>{const u={status:b.dataset.s};if(b.dataset.s==='signed')u.signed_at=today();if(b.dataset.s==='active')u.start_date=today();await q(sb.from('contracts').update(u).eq('id',b.dataset.id));aContracts()});
}

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')loginView()});
start().catch(()=>loginView());
}
</script>
</body>
